<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #A96C13; } a:hover { color: #7D4F0D; }
    .hint { opacity: 0; animation: cycle 16s infinite; }
    .hint:nth-child(2) { animation-delay: 4s; }
    .hint:nth-child(3) { animation-delay: 8s; }
    .hint:nth-child(4) { animation-delay: 12s; }
    @keyframes cycle {
      0%      { opacity: 0; transform: translateY(4px); }
      3%, 22% { opacity: 1; transform: translateY(0); }
      25%     { opacity: 0; transform: translateY(-4px); }
      100%    { opacity: 0; transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hint { animation: none; opacity: 0; }
      .hint:nth-child(1) { opacity: 1; }
    }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F6F6; color: #14181B; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 22px; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 3px;">

      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; color: #8B959C;">THURSDAY · 7:40 AM</div>
    </div>
    <div style="height: 44px; padding: 0 14px; border-radius: 11px; background: #FFFFFF; border: 1px solid #D3DADD; display: flex; align-items: center; gap: 8px; box-sizing: border-box;">
      <div style="color: #2F5F7A; display: flex;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.9 5.4L19.5 11l-5.6 1.6L12 18l-1.9-5.4L4.5 11l5.6-1.6z"></path><path d="M18.5 16.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"></path></svg>
      </div>
      <div style="font-size: 14.5px; font-weight: 600;">Inspire</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px; min-height: 0;">

    <div style="height: 330px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #D3DADD; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; padding: 14px 18px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.11em; color: #8B959C;">BREAKFAST</div>
        <div style="font-size: 17px; color: #C4CDD1;">—</div>
      </div>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; padding: 14px 18px; border-top: 1px solid #D3DADD;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.11em; color: #8B959C;">LUNCH</div>
        <div style="font-size: 17px; color: #C4CDD1;">—</div>
      </div>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; padding: 14px 18px; border-top: 1px solid #D3DADD;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.11em; color: #8B959C;">SNACKS</div>
        <div style="font-size: 17px; color: #C4CDD1;">—</div>
      </div>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; padding: 14px 18px; border-top: 1px solid #D3DADD;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.11em; color: #8B959C;">DINNER</div>
        <div style="font-size: 17px; color: #C4CDD1;">—</div>
      </div>
    </div>

    <div style="flex-shrink: 0; background: #FFFFFF; border: 1px solid #D3DADD; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.13em; color: #8B959C;">HOW THE DAY READS</div>
      <div style="font-size: 15.5px; line-height: 1.35; color: #59646C;">No day to read yet. The last three days have been light on protein.</div>
    </div>

  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="position: relative; height: 40px;">
      <div class="hint" style="position: absolute; top: 0; left: 0; right: 0; font-size: 15px; line-height: 1.35; color: #8B959C;">“what's for dinner?”</div>
      <div class="hint" style="position: absolute; top: 0; left: 0; right: 0; font-size: 15px; line-height: 1.35; color: #8B959C;">“there's a lot of bhindi lying around”</div>
      <div class="hint" style="position: absolute; top: 0; left: 0; right: 0; font-size: 15px; line-height: 1.35; color: #8B959C;">“krishna's off his food, keep it plain”</div>
      <div class="hint" style="position: absolute; top: 0; left: 0; right: 0; font-size: 15px; line-height: 1.35; color: #8B959C;">“plan me the whole of sunday”</div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; height: 62px; border-radius: 14px; background: #F3E7D3; border: 1px solid #A96C13; display: flex; align-items: center; gap: 13px; padding: 0 20px; box-sizing: border-box;">
        <div style="color: #A96C13; display: flex; flex-shrink: 0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="11.5" rx="3"></rect>
            <path d="M5.2 11a6.8 6.8 0 0 0 13.6 0"></path>
            <path d="M12 17.8v3.4"></path>
          </svg>
        </div>
        <div style="font-size: 16px; font-weight: 600;">Tap and talk</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
