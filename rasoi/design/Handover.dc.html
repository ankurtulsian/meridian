<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #A96C13; } a:hover { color: #7D4F0D; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F6F6; color: #14181B; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 30px 24px 18px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.13em; color: #8B959C;">FOR THE KITCHEN</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.13em; color: #8B959C;">NOT SENT YET</div>
  </div>

  <div style="flex-grow: 1; padding: 0 24px; overflow: hidden;">
    <div style="background: #FFFFFF; border: 1px solid #D3DADD; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 20px; font-family: 'Noto Sans Devanagari', 'IBM Plex Sans', sans-serif;">

      <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">कल · गुरुवार</div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.13em; color: #8B959C;">रात का खाना</div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 17px; font-weight: 500;">खिचड़ी</div>
          <div style="font-size: 15px; color: #59646C;">2 कटोरी चावल, 1 कटोरी मूंग दाल</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 17px; font-weight: 500;">दही</div>
          <div style="font-size: 15px; color: #59646C;">1 कटोरी, फेंट कर</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 17px; font-weight: 500;">पापड़</div>
          <div style="font-size: 15px; color: #59646C;">2, भून कर — तला नहीं</div>
        </div>
      </div>

      <div style="background: #F3E7D3; border-radius: 9px; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.13em; color: #A96C13;">कृष्णा के लिए</div>
        <div style="font-size: 15.5px; line-height: 1.5; color: #14181B;">मिर्च डालने से पहले एक कटोरी खिचड़ी अलग निकाल लें</div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px; padding: 13px 15px; border: 1px solid #D3DADD; border-radius: 9px;">
        <div style="color: #2F5F7A; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"></rect><path d="M10 9.5l5 2.5-5 2.5z"></path></svg>
        </div>
        <div style="font-size: 15px; color: #2F5F7A;">वीडियो देखें</div>
      </div>

      <div style="border-top: 1px solid #E9EDEE; padding-top: 16px; display: flex; flex-direction: column; gap: 5px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.13em; color: #8B959C;">कल के लिए</div>
        <div style="font-size: 15.5px; line-height: 1.5; color: #14181B;">राजमा आज रात भिगो दें</div>
      </div>

    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px; padding: 18px 24px 34px;">
    <div style="height: 50px; border-radius: 10px; background: #2F5F7A; display: flex; align-items: center; justify-content: center; gap: 9px; color: #FFFFFF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.8-5.2A8.4 8.4 0 1 1 21 11.5z"></path></svg>
      <div style="font-size: 15px; font-weight: 600;">Send on WhatsApp</div>
    </div>
    <div style="display: flex; gap: 9px;">
      <div style="flex-grow: 1; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #D3DADD; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #59646C;">Copy text</div>
      <div style="flex-grow: 1; height: 48px; border-radius: 10px; background: #FFFFFF; border: 1px solid #D3DADD; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #59646C;">Voice note</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
